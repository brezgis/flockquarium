<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flockquarium</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f3f7a'/%3E%3Cpath d='M12 32c8-11 20-14 34-8-3 3-3 13 0 16-14 6-26 3-34-8z' fill='%23ff8a2b'/%3E%3Cpath d='M46 24l10-7v30l-10-7' fill='%23ff8a2b'/%3E%3Cpath d='M25 20c-4 8-4 16 0 24' stroke='%23fff' stroke-width='4' fill='none'/%3E%3Ccircle cx='17' cy='30' r='3' fill='%23111'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; font: 13px system-ui, sans-serif; color: #9aa;
    background: linear-gradient(180deg, #0c121c 0%, #131c2a 52%, #1d2734 68%, #0a0d13 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
    position: relative;
  }
  /* wall glow + table reflection */
  body::before { content: ''; position: absolute; inset: 0; pointer-events: none; transition: opacity 1.2s;
    background: radial-gradient(ellipse 55% 45% at 50% 48%, rgba(70,150,255,.22), rgba(70,150,255,0) 70%),
                radial-gradient(ellipse 45% 12% at 50% 78%, rgba(90,190,255,.28), rgba(90,190,255,0) 70%); }
  body.off::before { opacity: .18; }
  .hint { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; color: #4f5b6b; transition: color 1.2s; }
  body.off .hint { color: #2a323d; }
  .hint kbd { background: #182030; border: 1px solid #2a3446; border-radius: 4px; padding: 1px 5px; font-size: 11px; color: #aab; }

  .lamp { width: min(94vw, 1100px, calc((100vh - 110px) * 1.28)); position: relative; user-select: none; }
  .silver { background: linear-gradient(180deg, #f7f7f7 0%, #dedede 22%, #c3c3c3 48%, #cdcdcd 62%, #a7a7a7 100%); position: relative; }
  .silver::before { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 1px, rgba(0,0,0,.015) 1px 2px); }   /* brushed */

  /* cap: thick, domed, slight overhang */
  .cap { aspect-ratio: 11.5 / 1; margin: 0 -1.6%; border-radius: 28px 28px 9px 9px / 60% 60% 30% 30%; z-index: 3;
    box-shadow: inset 0 3px 0 rgba(255,255,255,.9), inset 0 -4px 8px rgba(0,0,0,.28), 0 4px 6px rgba(0,0,0,.45), 0 1px 0 #6b6b6b; }
  .cap::after { content: ''; position: absolute; left: 2%; right: 2%; top: 58%; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(0,0,0,.28) 15%, rgba(0,0,0,.28) 85%, transparent), linear-gradient(#fff8, #fff8); background-size: 100% 1px, 100% 1px; background-position: 0 0, 0 1px; background-repeat: no-repeat; }
  .cap .vent { position: absolute; top: 24%; height: 6%; width: 22%; left: 10%; opacity: .35;
    background: radial-gradient(circle, #666 0 28%, transparent 32%) 0 0 / 4.5% 100% repeat-x; }
  .cap .vent.r { left: auto; right: 10%; }

  /* glass: acrylic housing wider than the drum, clear columns either side */
  .glass { aspect-ratio: 2.02 / 1; position: relative; margin: 0 0.4%; background: #06080d; overflow: hidden;
    border-radius: 0 0 26px 26px / 0 0 34px 34px; z-index: 2;
    box-shadow: 0 0 70px rgba(80,160,255,.38), 0 0 160px rgba(60,120,255,.2), inset 0 0 0 1px rgba(255,255,255,.06); transition: box-shadow 1.2s; }
  body.off .glass { box-shadow: 0 0 30px rgba(40,70,140,.15), inset 0 0 0 1px rgba(255,255,255,.04); }
  .drum { position: absolute; top: 0; bottom: 0; left: 5.5%; width: 89%; background: #000; }
  canvas { display: block; width: 100%; height: 100%; cursor: none; touch-action: none; }
  .drumEdge { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(0,0,0,.85), rgba(0,0,0,.35) 1.2%, transparent 4%),
                linear-gradient(-90deg, rgba(0,0,0,.85), rgba(0,0,0,.35) 1.2%, transparent 4%),
                linear-gradient(180deg, rgba(0,0,0,.6), rgba(0,0,0,.2) 3%, transparent 9%); }
  .acrylic { position: absolute; inset: 0; pointer-events: none; transition: opacity 1.2s;
    background:
      /* drum light bleeding into the clear side columns */
      linear-gradient(90deg, rgba(60,150,255,0) 0%, rgba(80,170,255,.35) 5.5%, rgba(80,170,255,0) 9%),
      linear-gradient(-90deg, rgba(60,150,255,0) 0%, rgba(80,170,255,.35) 5.5%, rgba(80,170,255,0) 9%),
      /* reflection streaks on the curved acrylic */
      linear-gradient(90deg, rgba(255,255,255,.55) 0.3%, rgba(255,255,255,.10) 1.3%, rgba(255,255,255,0) 2.6%, rgba(255,255,255,0) 3.6%, rgba(255,255,255,.22) 4.2%, rgba(255,255,255,0) 5.2%),
      linear-gradient(-90deg, rgba(255,255,255,.55) 0.3%, rgba(255,255,255,.10) 1.3%, rgba(255,255,255,0) 2.6%, rgba(255,255,255,0) 3.6%, rgba(255,255,255,.22) 4.2%, rgba(255,255,255,0) 5.2%),
      linear-gradient(90deg, rgba(255,255,255,0) 11%, rgba(255,255,255,.06) 12.5%, rgba(255,255,255,0) 15%),
      /* shadow under the cap, light on the base lip */
      linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,0) 7%),
      linear-gradient(0deg, rgba(120,200,255,.22), rgba(120,200,255,0) 6%); }
  body.off .acrylic { opacity: .45; }

  /* base: wide platform with a groove, screws, spill of light, then a narrower foot */
  .base { aspect-ratio: 7.4 / 1; margin: 0 -1.6%; border-radius: 9px 9px 22px 22px / 30% 30% 45% 45%; z-index: 3;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.85), inset 0 -5px 10px rgba(0,0,0,.3), 0 6px 8px rgba(0,0,0,.45); }
  .base .spill { position: absolute; left: 3%; right: 3%; top: 0; height: 55%; pointer-events: none; transition: opacity 1.2s;
    background: radial-gradient(ellipse 50% 100% at 50% 0%, rgba(110,200,255,.55), rgba(110,200,255,0) 80%); }
  body.off .base .spill { opacity: .15; }
  .base .groove { position: absolute; left: 1.5%; right: 1.5%; top: 26%; height: 3px;
    background: linear-gradient(#5a5a5a, #2e2e2e 50%, #fdfdfd); opacity: .8; }
  .base .screw { position: absolute; top: 20%; width: 1.1%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #f2f2f2, #8a8a8a 55%, #555); box-shadow: 0 1px 1px rgba(0,0,0,.5); }
  .base .screw.l { left: 4%; } .base .screw.r { right: 4%; }
  .base .screw::after { content: ''; position: absolute; left: 20%; right: 20%; top: 45%; height: 12%; background: #444; transform: rotate(-30deg); }
  .foot { aspect-ratio: 20 / 1; margin: -2px 2% 0; border-radius: 4px 4px 18px 18px; z-index: 1;
    background: linear-gradient(180deg, #8f8f8f, #6e6e6e 50%, #4f4f4f); box-shadow: 0 10px 14px rgba(0,0,0,.6); }
  .shadow { position: absolute; left: -10%; right: -10%; bottom: -5%; height: 9%; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(0,0,0,.85), rgba(0,0,0,0) 70%); }
  .cord { position: absolute; right: -9%; bottom: 2%; width: 12%; height: 22%; z-index: 0; overflow: visible; }

  .switch {
    position: absolute; right: 7%; top: 40%; width: 6%; aspect-ratio: 1.55 / 1; background: #0e0e0e; border-radius: 7px;
    box-shadow: inset 0 0 0 2px #262626, inset 0 0 0 3px #0a0a0a, 0 1px 2px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.15); cursor: pointer; overflow: hidden;
  }
  .switch .rocker { position: absolute; inset: 14% 9%; border-radius: 5px; display: flex; align-items: center; justify-content: space-around;
    color: #d6d6d6; font: bold 1.05vw/1 system-ui, sans-serif; transform-origin: 50% 50%; transition: background .15s, transform .15s; }
  .switch .rocker span { pointer-events: none; text-shadow: 0 1px 0 #000; }
  body:not(.off) .switch .rocker { background: linear-gradient(90deg, #1a1a1a, #3a3a3a 55%, #2a2a2a); transform: perspective(60px) rotateY(12deg); }
  body.off .switch .rocker { background: linear-gradient(90deg, #2a2a2a, #3a3a3a 45%, #161616); transform: perspective(60px) rotateY(-12deg); }

  /* info sticker on the base */
  .sticker { position: absolute; left: 5%; top: 34%; width: 34%; padding: 0.45% 0.8%; box-sizing: border-box;
    background: linear-gradient(#fbfaf4, #ece9dc); color: #2a2a2a; border: 1px solid #b8b5a8; border-radius: 3px;
    font: 500 0.68vw/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .01em;
    transform: rotate(-0.8deg); box-shadow: 0 1px 1px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.7); z-index: 2; }
  .sticker::after { content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: 3px;
    background: linear-gradient(115deg, rgba(255,255,255,.35), rgba(255,255,255,0) 40%, rgba(0,0,0,.05) 100%); }
  .sticker b { font-weight: 800; letter-spacing: .08em; font-size: 1.05em; }
  .sticker .row { display: flex; justify-content: space-between; gap: 1em; flex-wrap: wrap; }
  .sticker .row.head { white-space: nowrap; }
  .sticker .dim { color: #6b6a62; }
  .sticker a { color: #10429c; text-decoration: underline; text-underline-offset: 2px; }
  .sticker a:hover { color: #d2451e; }
  .sticker .bar { display: inline-flex; gap: 1px; height: 0.8vw; align-items: flex-end; align-self: center; }
  .sticker .bar i { display: block; background: #222; height: 100%; }
  @media (max-width: 700px) { .sticker { font-size: 8px; } }
</style>
</head>
<body>
<div class="lamp">
  <div class="cap silver"><div class="vent"></div><div class="vent r"></div></div>
  <div class="glass">
    <div class="drum"><canvas id="c"></canvas><div class="drumEdge"></div></div>
    <div class="acrylic"></div>
  </div>
  <div class="base silver">
    <div class="spill"></div><div class="groove"></div>
    <div class="sticker">
      <div class="row head"><b>FLOCKQUARIUM</b><span class="dim">model FQ-240 · rev.1 · 100–240V</span></div>
      <div class="row head"><span>three rules: separation · alignment · cohesion</span></div>
      <div class="row head"><span><a href="https://www.red3d.com/cwr/boids/" target="_blank" rel="noopener">boids (Reynolds, 1986)</a> · <a href="https://en.wikipedia.org/wiki/Boids" target="_blank" rel="noopener">wikipedia</a> · <a href="https://www.google.com/search?tbm=isch&q=aquarium+motion+lamp+rotating" target="_blank" rel="noopener">the lamp</a></span><span class="bar"><i style='width:2px'></i><i style='width:1px;background:none'></i><i style='width:1px'></i><i style='width:2px;background:none'></i><i style='width:3px'></i><i style='width:1px;background:none'></i><i style='width:1px'></i><i style='width:1px;background:none'></i><i style='width:2px'></i><i style='width:2px;background:none'></i><i style='width:1px'></i><i style='width:1px;background:none'></i><i style='width:3px'></i><i style='width:2px;background:none'></i><i style='width:2px'></i><i style='width:1px;background:none'></i><i style='width:1px'></i><i style='width:3px;background:none'></i><i style='width:2px'></i><i style='width:1px;background:none'></i><i style='width:1px'></i><i style='width:1px;background:none'></i><i style='width:3px'></i><i style='width:1px;background:none'></i><i style='width:1px'></i><i style='width:2px;background:none'></i><i style='width:2px'></i><i style='width:1px;background:none'></i><i style='width:1px'></i><i style='width:1px;background:none'></i><i style='width:2px'></i><i style='width:2px;background:none'></i><i style='width:3px'></i><i style='width:1px;background:none'></i><i style='width:1px'></i><i style='width:1px;background:none'></i><i style='width:2px'></i><i style='width:1px;background:none'></i><i style='width:1px'></i><i style='width:2px;background:none'></i></span></div>
    </div>
<i class="screw l"></i><i class="screw r"></i>
    <div class="switch" id="switch" title="light"><div class="rocker"><span>I</span><span>O</span></div></div>
  </div>
  <div class="foot"></div>
  <svg class="cord" viewBox="0 0 120 120" preserveAspectRatio="none">
    <path d="M0 40 C 40 40, 60 70, 120 100" fill="none" stroke="#0b0b0b" stroke-width="7" stroke-linecap="round"/>
    <path d="M0 38 C 40 38, 60 68, 120 98" fill="none" stroke="#3a3a3a" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>
  </svg>
  <div class="shadow"></div>
</div>

<script>
'use strict';
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const mod = (v, m) => ((v % m) + m) % m;

// ---------------------------------------------------------------------------
// The oval drum: ellipse cross-section (half-width 1, depth DEPTH), viewed head-on.
// We need arc length ↔ screen-x maps so the texture/fish move uniformly along
// the drum, and compress at the edges as it curves away.
// ---------------------------------------------------------------------------
const DEPTH = 0.35;        // oval flatness: 1 = round cylinder, small = flat drum
const BACK = 0.6;          // hidden back-arc length as a fraction of the visible front arc
const N = 4000;
const phiS = new Float64Array(N + 1);            // cumulative arc length at phi_i (unit half-width)
let SFRONT = 0;
{
  let s = 0, px = -1, pz = 0;
  for (let i = 0; i <= N; i++) {
    const phi = -Math.PI / 2 + Math.PI * i / N, x = Math.sin(phi), z = DEPTH * Math.cos(phi);
    if (i) s += Math.hypot(x - px, z - pz);
    phiS[i] = s; px = x; pz = z;
  }
  SFRONT = s;
}
const M = 4096;
const sX = new Float64Array(M + 1), sC = new Float64Array(M + 1);   // s → screen x (unit), s → horizontal compression
{
  let j = 0;
  for (let i = 0; i <= M; i++) {
    const s = SFRONT * i / M;
    while (j < N && phiS[j + 1] < s) j++;
    const t = j < N ? (s - phiS[j]) / (phiS[j + 1] - phiS[j] || 1) : 0;
    const phi = -Math.PI / 2 + Math.PI * (j + t) / N;
    sX[i] = Math.sin(phi);
    sC[i] = Math.cos(phi) / Math.hypot(Math.cos(phi), DEPTH * Math.sin(phi));
  }
}
function xToS(xu) { const phi = Math.asin(clamp(xu, -1, 1)); const f = (phi + Math.PI / 2) / Math.PI * N; const i = Math.min(N - 1, Math.floor(f)); return lerp(phiS[i], phiS[i + 1], f - i); }
function sToX(su) { const f = clamp(su / SFRONT, 0, 1) * M; const i = Math.min(M - 1, Math.floor(f)); return lerp(sX[i], sX[i + 1], f - i); }
function sToC(su) { const f = clamp(su / SFRONT, 0, 1) * M; const i = Math.min(M - 1, Math.floor(f)); return lerp(sC[i], sC[i + 1], f - i); }

// ---------------------------------------------------------------------------
// Background texture: user panorama(s) if present, else a procedural reef.
// ---------------------------------------------------------------------------
const TH = 1024;
// Layers: back = opaque reef panorama (panorama*.jpg), front = transparent kelp/coral (foreground*.png), rolling faster.
const layers = [];   // { tex2, TW, speed }
function loadImage(src) { return new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; }); }
async function findImages(prefix) {
  const found = [];
  for (const base of [prefix + '-1', prefix + '-2', prefix + '-3', prefix + '-4']) {
    let im = null; for (const ext of ['jpg', 'png', 'webp']) { im = await loadImage(`${base}.${ext}`); if (im) break; }
    if (im) found.push(im);
  }
  if (!found.length) for (const ext of ['jpg', 'png', 'webp']) { const im = await loadImage(`${prefix}.${ext}`); if (im) { found.push(im); break; } }
  return found;
}
function makeLayer(tex, TW, speed) {
  const tex2 = document.createElement('canvas'); tex2.width = TW * 2; tex2.height = TH;
  const g = tex2.getContext('2d'); g.drawImage(tex, 0, 0); g.drawImage(tex, TW, 0);
  return { tex2, TW, speed };
}
async function loadPanorama() {
  const back = await findImages('panorama');
  if (back.length) { const [tex, TW] = stitch(back); layers.push(makeLayer(tex, TW, 1)); }
  else { const [tex, TW] = proceduralReef(); layers.push(makeLayer(tex, TW, 1)); }
  const front = await findImages('foreground');
  if (front.length) { const [tex, TW] = stitch(front); layers.push(makeLayer(tex, TW, 1.6)); }
}
function stitch(imgs) {
  const ws = imgs.map(im => Math.round(im.width * TH / im.height));
  const ov = Math.round(Math.min(...ws) * 0.10);           // cross-fade width
  const TW = ws.reduce((a, b) => a + b, 0) - ov * imgs.length;
  const tex = document.createElement('canvas'); tex.width = TW; tex.height = TH;
  const g = tex.getContext('2d');
  let off = 0; const offs = [];
  imgs.forEach((im, i) => { offs.push(off); g.drawImage(im, off, 0, ws[i], TH); off += ws[i] - ov; });
  // blend each image's right end over whatever follows it (last one wraps to the start)
  const tmp = document.createElement('canvas'); tmp.width = ov; tmp.height = TH; const t = tmp.getContext('2d');
  imgs.forEach((im, i) => {
    t.clearRect(0, 0, ov, TH); t.globalCompositeOperation = 'source-over';
    t.drawImage(im, 0, 0, im.width, im.height, -(ws[i] - ov), 0, ws[i], TH);
    const grad = t.createLinearGradient(0, 0, ov, 0); grad.addColorStop(0, 'rgba(0,0,0,1)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
    t.globalCompositeOperation = 'destination-in'; t.fillStyle = grad; t.fillRect(0, 0, ov, TH);
    g.drawImage(tmp, mod(offs[i] + ws[i] - ov, TW), 0);
  });
  return [tex, TW];
}
function proceduralReef() {
  const TW = 4600, tex = document.createElement('canvas'); tex.width = TW; tex.height = TH;
  const g = tex.getContext('2d');
  const bg = g.createLinearGradient(0, 0, 0, TH); bg.addColorStop(0, '#2c9fe8'); bg.addColorStop(.45, '#1266b8'); bg.addColorStop(1, '#0a2f6b');
  g.fillStyle = bg; g.fillRect(0, 0, TW, TH);
  const wrapDraw = fn => { for (const dx of [0, -TW, TW]) { g.save(); g.translate(dx, 0); fn(); g.restore(); } };
  let seed = 7; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  // distant reef silhouettes
  wrapDraw(() => { g.fillStyle = 'rgba(8,40,110,.55)'; for (let i = 0; i < 60; i++) { const x = r() * TW, w = 80 + r() * 260, h = 120 + r() * 260; g.beginPath(); g.ellipse(x, TH - 150, w, h, 0, Math.PI, 0); g.fill(); } });
  // kelp
  wrapDraw(() => { for (let i = 0; i < 70; i++) { const x = r() * TW, h = 250 + r() * 520, ph = r() * TAU, w = 8 + r() * 14;
    g.strokeStyle = `hsla(${95 + r() * 40},60%,${30 + r() * 15}%,.9)`; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(x, TH - 100);
    for (let y = 0; y <= h; y += 24) g.lineTo(x + Math.sin(y / 70 + ph) * 22 * (y / h), TH - 100 - y); g.stroke(); } });
  // coral blobs
  wrapDraw(() => { for (let i = 0; i < 160; i++) { const x = r() * TW, y = TH - 60 - r() * 200, s = 14 + r() * 50;
    const hue = [10, 25, 330, 290, 45, 160][Math.floor(r() * 6)]; g.fillStyle = `hsla(${hue},70%,${50 + r() * 20}%,.9)`;
    for (let k = 0; k < 5; k++) { g.beginPath(); g.arc(x + (r() - .5) * s * 1.6, y - r() * s * 1.2, s * (0.35 + r() * 0.5), 0, TAU); g.fill(); } } });
  // sand
  g.fillStyle = '#d7c48d'; g.beginPath(); g.moveTo(0, TH); for (let x = 0; x <= TW; x += 40) g.lineTo(x, TH - 70 - Math.sin(x / 190) * 14 - Math.sin(x / 57) * 6); g.lineTo(TW, TH); g.fill();
  g.fillStyle = 'rgba(0,0,0,.12)'; for (let i = 0; i < 400; i++) { g.beginPath(); g.arc(r() * TW, TH - r() * 60, 1 + r() * 2, 0, TAU); g.fill(); }
  // surface shimmer
  const sh = g.createLinearGradient(0, 0, 0, 80); sh.addColorStop(0, 'rgba(255,255,255,.55)'); sh.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = sh; g.fillRect(0, 0, TW, 80);
}

// ---------------------------------------------------------------------------
// Fish species (colors dim toward silhouettes when the light is off)
// ---------------------------------------------------------------------------
const SPECIES = [
  { body: [22, 90, 55], fin: [22, 90, 45], stripes: '#fff', pattern: 'bands' },       // clownfish
  { body: [52, 95, 55], fin: [45, 90, 45], pattern: 'plain' },                          // yellow tang
  { body: [215, 80, 55], fin: [230, 70, 40], stripes: '#0a1030', pattern: 'streak' },  // blue tang
  { body: [48, 90, 60], fin: [40, 80, 45], stripes: '#2a1a10', pattern: 'bands' },     // banded angelfish
  { body: [330, 60, 62], fin: [320, 60, 50], pattern: 'plain' },                        // pink
  { body: [175, 60, 50], fin: [185, 60, 40], stripes: '#0b3040', pattern: 'streak' },  // teal
];
const col = (c, L, a = 1) => `hsla(${c[0]},${c[1] * (0.25 + 0.75 * L)}%,${c[2] * (0.10 + 0.90 * L)}%,${a})`;

function drawFish(c, f, L, t) {
  const sp = SPECIES[f.species];
  const wag = Math.sin(f.clock * 14 + f.phase) * (0.25 + 0.3 * f.speedN);
  c.scale(1, 1 - Math.min(0.45, Math.abs(f.turn) * 3.5));
  // tail
  c.fillStyle = col(sp.fin, L);
  c.save(); c.translate(-6, 0); c.rotate(wag);
  c.beginPath(); c.moveTo(0, 0); c.lineTo(-6.5, -5); c.lineTo(-5, 0); c.lineTo(-6.5, 5); c.closePath(); c.fill(); c.restore();
  // dorsal & pelvic fins
  c.beginPath(); c.moveTo(3, -1.5); c.quadraticCurveTo(-1, -7, -5, -1.5); c.fill();
  c.beginPath(); c.moveTo(1, 2); c.quadraticCurveTo(-2, 5.5, -4, 2); c.fill();
  // body
  c.beginPath(); c.moveTo(10, 0); c.quadraticCurveTo(3, -5.5, -6.5, 0); c.quadraticCurveTo(3, 5.5, 10, 0); c.closePath();
  c.fillStyle = col(sp.body, L); c.fill();
  if (sp.pattern !== 'plain') {
    c.save(); c.clip();
    c.fillStyle = sp.stripes; c.globalAlpha = 0.25 + 0.75 * L;
    if (sp.pattern === 'bands') { for (const x of [4.5, -1.5]) c.fillRect(x - 1, -6, 2, 12); }
    else { c.beginPath(); c.moveTo(6, -1); c.quadraticCurveTo(0, -3, -5, -1); c.quadraticCurveTo(0, -1, 6, -1); c.fill(); }
    c.restore();
  }
  // pectoral fin flick
  c.fillStyle = col(sp.fin, L, .8); c.save(); c.translate(3, 1); c.rotate(0.5 + Math.sin(f.clock * 9) * 0.35);
  c.beginPath(); c.moveTo(0, 0); c.lineTo(-3.5, -1.2); c.lineTo(-3.5, 1.4); c.closePath(); c.fill(); c.restore();
  // eye
  c.fillStyle = `rgba(255,255,255,${0.35 + 0.65 * L})`; c.beginPath(); c.arc(6.3, -1.2, 1.3, 0, TAU); c.fill();
  c.fillStyle = '#0a0a12'; c.beginPath(); c.arc(6.7, -1.2, 0.65, 0, TAU); c.fill();
  if (L < 0.6) { c.fillStyle = `rgba(190,230,255,${(0.6 - L) * 1.2})`; c.beginPath(); c.arc(6.9, -1.5, 0.35, 0, TAU); c.fill(); } // eyeshine
}
function drawShark(c, t, L) {
  c.save(); c.scale(3.6, 3.6);
  const wag = Math.sin(t * 7) * 0.22, grey = `hsl(210,12%,${22 + 30 * L}%)`, belly = `hsl(210,15%,${40 + 50 * L}%)`;
  // tail (crescent), wagging
  c.save(); c.translate(-9, 0); c.rotate(wag); c.fillStyle = grey;
  c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(-4, -3, -6, -7.5); c.quadraticCurveTo(-3.5, -2.5, -1.5, 0); c.quadraticCurveTo(-3.5, 2, -5, 5.5); c.quadraticCurveTo(-3.5, 2.5, 0, 0); c.fill(); c.restore();
  // dorsal fin
  c.fillStyle = grey; c.beginPath(); c.moveTo(1, -3); c.quadraticCurveTo(-1, -8.5, -4, -9); c.quadraticCurveTo(-4.5, -5, -5.5, -2.5); c.closePath(); c.fill();
  // pectoral fin (far side, lower)
  c.beginPath(); c.moveTo(3, 1.5); c.quadraticCurveTo(0, 6.5, -3, 8); c.quadraticCurveTo(-2, 4, -1.5, 2); c.closePath(); c.fill();
  // body
  c.beginPath(); c.moveTo(13, 0); c.quadraticCurveTo(6, -5.2, -4, -3.4); c.quadraticCurveTo(-8, -2, -10, 0); c.quadraticCurveTo(-8, 2, -4, 3.6); c.quadraticCurveTo(6, 5.4, 13, 0); c.closePath();
  c.fillStyle = grey; c.fill();
  c.save(); c.clip();                                                       // white belly
  c.fillStyle = belly; c.beginPath(); c.moveTo(13, 0.6); c.quadraticCurveTo(6, 1.2, -4, 1.4); c.quadraticCurveTo(-8, 1.6, -10, 2); c.lineTo(-10, 7); c.lineTo(13, 7); c.closePath(); c.fill();
  c.restore();
  // gills
  c.strokeStyle = `rgba(0,0,0,${0.35 + 0.2 * L})`; c.lineWidth = 0.5; for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(3.5 - i * 1.1, -1.8); c.quadraticCurveTo(2.8 - i * 1.1, 0, 3.6 - i * 1.1, 1.8); c.stroke(); }
  // eye
  c.fillStyle = `rgba(255,255,255,${0.5 + 0.5 * L})`; c.beginPath(); c.arc(8.5, -1.7, 0.9, 0, TAU); c.fill();
  c.fillStyle = '#000'; c.beginPath(); c.arc(8.7, -1.7, 0.55, 0, TAU); c.fill();
  // mouth + teeth
  c.strokeStyle = `rgba(0,0,0,${0.6 + 0.2 * L})`; c.lineWidth = 0.6; c.beginPath(); c.moveTo(11.5, 1.2); c.quadraticCurveTo(8, 2.2, 5, 2.6); c.stroke();
  c.fillStyle = `rgba(255,255,255,${0.75 + 0.25 * L})`;
  for (let i = 0; i < 5; i++) { const x = 11 - i * 1.3, y = 1.35 + i * 0.28; c.beginPath(); c.moveTo(x, y); c.lineTo(x - 0.45, y + 1.3); c.lineTo(x - 0.9, y + 0.1); c.closePath(); c.fill(); }
  c.restore();
}

// ---------------------------------------------------------------------------
// World & simulation
// ---------------------------------------------------------------------------
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
let W = 0, H = 0, A = 0, CX = 0, SF = 0, RING = 0;     // A = half width px, SF = front arc px, RING = full ring px
function resize() {
  const dpr = window.devicePixelRatio || 1, r = canvas.getBoundingClientRect();
  W = r.width; H = r.height; A = W / 2; CX = W / 2; SF = SFRONT * A; RING = SF * (1 + BACK);
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  for (const f of fish) f.x = mod(f.x, RING);
}
const fish = [];
const NFISH = 260;
function spawn() {
  for (let i = 0; i < NFISH; i++) {
    const a = rand(0, TAU), sp = rand(40, 70);
    fish.push({ x: rand(0, RING), y: rand(H * 0.15, H * 0.85), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      angle: a, turn: 0, phase: rand(0, TAU), clock: rand(0, 10), scale: rand(0.8, 1.2) * Math.min(1, W / 900),
      species: Math.floor(Math.random() * SPECIES.length), speedN: 0.5, scare: 0, wob: rand(0, TAU), maxSpeed: 82 * rand(0.85, 1.15), dir: Math.random() < P.rightFrac ? 1 : -1, wobRate: rand(0.9, 1.5) });
  }
}
const mouse = { x: -1e9, y: -1e9, sx: 0, in: false, down: false, dx: 1, ang: 0 };
function mousePos(e) {
  const r = canvas.getBoundingClientRect(), p = e.touches ? e.touches[0] : e;
  const nx = p.clientX - r.left, ny = p.clientY - r.top;
  if (mouse.in) { const dx = nx - mouse.x, dy = ny - mouse.y; if (Math.hypot(dx, dy) > 1.5) { const a = Math.atan2(dy, dx); let d = a - mouse.ang; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; mouse.ang += d * 0.25; } }
  mouse.x = nx; mouse.y = ny; mouse.sx = xToS((nx - CX) / A) * A;
}
canvas.addEventListener('mousemove', e => { mousePos(e); mouse.in = true; });
canvas.addEventListener('mouseleave', () => { mouse.in = false; mouse.down = false; });
canvas.addEventListener('mousedown', e => { mousePos(e); mouse.in = true; mouse.down = true; e.preventDefault(); });
window.addEventListener('mouseup', () => { mouse.down = false; });
canvas.addEventListener('touchstart', e => { mousePos(e); mouse.in = true; mouse.down = true; e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchmove', e => { mousePos(e); e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchend', () => { mouse.in = false; mouse.down = false; });

let lit = true, light = 1, drumOn = true, scroll = 0;
const setLit = v => { lit = v; document.body.classList.toggle('off', !lit); };
document.getElementById('switch').addEventListener('click', () => setLit(!lit));
window.addEventListener('keydown', e => { if (e.key === 'l' || e.key === 'L') setLit(!lit); if (e.key === ' ') { drumOn = !drumOn; e.preventDefault(); } });

// The three rules, Reynolds-style: each rule yields a desired velocity, the steering force is
// (desired - velocity) capped at maxForce. Boids only see things inside their field of view.
// Ring-wrap-aware in x so schools cross the edge intact.
const P = { perception: 54, sepDist: 30, fov: -0.55, maxForce: 240, wSep: 1.9, wAli: 1.0, wCoh: 0.75,
            minSpeed: 34, maxSpeed: 82, wall: 34, wCur: 0.5, rightFrac: 0.75 };   // wCur: pull toward each fish's own preferred direction; rightFrac: share that prefer right
function limit(x, y, m) { const l = Math.hypot(x, y); return l > m ? [x * m / l, y * m / l] : [x, y]; }
function steer(f, dx, dy, ms) { const l = Math.hypot(dx, dy) || 1; return limit(dx / l * ms - f.vx, dy / l * ms - f.vy, P.maxForce); }
function step(dt) {
  const predator = mouse.in && mouse.down, sleepy = 1 - light;
  const perc2 = P.perception ** 2, sep2 = P.sepDist ** 2;
  const fearR = predator ? 170 : 75;
  const cell = P.perception, cols = Math.ceil(RING / cell), grid = new Map();
  for (const f of fish) { const k = Math.floor(f.x / cell) + cols * Math.floor(f.y / cell); (grid.get(k) || grid.set(k, []).get(k)).push(f); }
  for (const f of fish) {
    const ms = f.maxSpeed * (1 - 0.6 * sleepy);
    const sp = Math.hypot(f.vx, f.vy) || 1, hx = f.vx / sp, hy = f.vy / sp;
    let ax = 0, ay = 0, cx = 0, cy = 0, sx = 0, sy = 0, n = 0, ns = 0;
    const gx = Math.floor(f.x / cell), gy = Math.floor(f.y / cell);
    for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
      const bucket = grid.get(mod(gx + i, cols) + cols * (gy + j)); if (!bucket) continue;
      for (const o of bucket) {
        if (o === f) continue;
        let dx = o.x - f.x; if (dx > RING / 2) dx -= RING; else if (dx < -RING / 2) dx += RING;
        const dy = o.y - f.y, d2 = dx * dx + dy * dy;
        if (d2 > perc2 || d2 < 0.01) continue;
        const d = Math.sqrt(d2);
        if ((dx * hx + dy * hy) / d < P.fov) continue;                 // behind me: can't see it
        n++; ax += o.vx; ay += o.vy; cx += dx; cy += dy;
        if (d2 < sep2) { ns++; sx -= dx / d / d; sy -= dy / d / d; }   // closer = stronger
      }
    }
    let fx = 0, fy = 0;
    if (ns) { const [x, y] = steer(f, sx, sy, ms); fx += x * P.wSep; fy += y * P.wSep; }
    if (n) {
      let [x, y] = steer(f, ax, ay, ms); fx += x * P.wAli; fy += y * P.wAli;
      [x, y] = steer(f, cx / n, cy / n, ms); fx += x * P.wCoh; fy += y * P.wCoh;
    }
    { const [x, y] = steer(f, f.dir, 0, ms); fx += x * P.wCur; fy += y * P.wCur; }   // each fish has a preferred direction (most go right, drum turns left)
    // tank surface / floor: steer back inside when close (fish are free to travel vertically otherwise)
    if (f.y < P.wall) { const [x, y] = steer(f, f.vx, ms, ms); const k = 1 - f.y / P.wall; fx += x * k * 2; fy += y * k * 2; }
    if (f.y > H - P.wall) { const [x, y] = steer(f, f.vx, -ms, ms); const k = 1 - (H - f.y) / P.wall; fx += x * k * 2; fy += y * k * 2; }
    // faint wander so a lone fish meanders
    f.wob += dt * f.wobRate; const wob = (Math.sin(f.wob) * 0.7 + Math.sin(f.wob * 2.3 + 1) * 0.3) * 32 * (1 + sleepy);
    fx += -hy * wob; fy += hx * wob;
    // cursor
    f.scare = Math.max(0, f.scare - dt * 1.2);
    if (mouse.in && f.x < SF) {
      let dx = f.x - mouse.sx; const dy = f.y - mouse.y, d = Math.hypot(dx, dy);
      if (d < fearR && d > 0.01) { const k = 1 - d / fearR, str = predator ? 1100 * k * k : 320 * k * k; fx += dx / d * str; fy += dy / d * str; if (predator) f.scare = 1; }
    }
    [fx, fy] = limit(fx, fy, P.maxForce * (f.scare > 0 ? 4 : 1.6));   // stacked rules can't yank
    f.vx += fx * dt; f.vy += fy * dt;
    const boost = 1 + f.scare * 0.9, sp2 = Math.hypot(f.vx, f.vy) || 1e-6, tgt = clamp(sp2, P.minSpeed * (1 - 0.6 * sleepy), ms * boost);
    f.vx *= tgt / sp2; f.vy *= tgt / sp2;
  }
  for (const f of fish) {
    f.x = mod(f.x + f.vx * dt, RING); f.y = clamp(f.y + f.vy * dt, 4, H - 4);
    const na = Math.atan2(f.vy, f.vx); let da = na - f.angle; while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
    const maxTurn = (f.scare > 0 ? 9 : 4.5) * dt;                       // rad/s the body can actually swing
    const step = clamp(da * Math.min(1, dt * 8), -maxTurn, maxTurn);   // body eases toward the velocity heading
    f.angle += step; f.turn = f.turn * 0.9 + (step / Math.max(dt, 1e-3)) * 0.012;
    const spN = Math.hypot(f.vx, f.vy) / P.maxSpeed; f.speedN += (spN - f.speedN) * Math.min(1, dt * 4);
    f.clock += dt * (0.4 + f.speedN * 1.2);
  }
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
const bubbles = Array.from({ length: 14 }, () => ({ x: Math.random(), y: Math.random(), r: rand(1.5, 4), v: rand(18, 40), ph: rand(0, TAU) }));
const rays = Array.from({ length: 5 }, (_, i) => ({ x: i / 5 + rand(0, .1), w: rand(.05, .12), v: rand(-.01, .01), ph: rand(0, TAU) }));
function drawDrum() {
  if (!layers.length) { ctx.fillStyle = '#0a3a7a'; ctx.fillRect(0, 0, W, H); return; }
  const strip = 3;
  for (const L of layers) {
    const k = L.TW / (2 * SF);                               // texture px per arc px (full perimeter = 2 front arcs)
    for (let x0 = 0; x0 < W; x0 += strip) {
      const x1 = Math.min(W, x0 + strip);
      const s0 = xToS((x0 - CX) / A) * A, s1 = xToS((x1 - CX) / A) * A;
      const u0 = (s0 + scroll * L.speed) * k, sw = Math.max(0.5, (s1 - s0) * k);
      ctx.drawImage(L.tex2, mod(u0, L.TW), 0, sw, TH, x0, 0, x1 - x0, H);
    }
  }
}
function draw(t) {
  drawDrum();
  // light rays (only when lit)
  if (light > 0.02) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const r of rays) {
      const x = mod(r.x + Math.sin(t * 0.15 + r.ph) * 0.05, 1) * W, w = r.w * W;
      const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, `rgba(255,255,230,${0.16 * light})`); g.addColorStop(0.8, 'rgba(255,255,230,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + w, 0); ctx.lineTo(x + w * 2.2 + 40, H); ctx.lineTo(x + w * 1.2 - 20, H); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  // night tint
  if (light < 0.98) { ctx.fillStyle = `rgba(4,10,40,${0.82 * (1 - light)})`; ctx.fillRect(0, 0, W, H); }
  // fish (only the front arc), compressed toward the edges as the drum curves away
  for (const f of fish) {
    if (f.x >= SF) continue;
    const su = f.x / A, sx = CX + sToX(su) * A, comp = sToC(su);
    if (comp < 0.08) continue;
    ctx.save(); ctx.translate(sx, f.y); ctx.globalAlpha = clamp(comp * 2.5, 0, 1);
    ctx.scale(comp, 1); ctx.rotate(f.angle); ctx.scale(f.scale * 1.6, f.scale * 1.6);
    drawFish(ctx, f, light, t); ctx.restore();
  }
  // bubbles
  ctx.strokeStyle = `rgba(255,255,255,${0.15 + 0.35 * light})`; ctx.lineWidth = 1;
  for (const b of bubbles) {
    const x = b.x * W + Math.sin(t * 1.3 + b.ph) * 6, y = b.y * H;
    ctx.beginPath(); ctx.arc(x, y, b.r, 0, TAU); ctx.stroke();
    ctx.fillStyle = `rgba(255,255,255,${0.25 * light})`; ctx.beginPath(); ctx.arc(x - b.r * .3, y - b.r * .3, b.r * .3, 0, TAU); ctx.fill();
  }
  // curved-glass edge shading
  const eg = ctx.createLinearGradient(0, 0, W, 0);
  eg.addColorStop(0, 'rgba(0,0,20,.7)'); eg.addColorStop(0.09, 'rgba(0,0,20,.18)'); eg.addColorStop(0.2, 'rgba(0,0,20,0)');
  eg.addColorStop(0.8, 'rgba(0,0,20,0)'); eg.addColorStop(0.91, 'rgba(0,0,20,.18)'); eg.addColorStop(1, 'rgba(0,0,20,.7)');
  ctx.fillStyle = eg; ctx.fillRect(0, 0, W, H);
  // cursor
  if (mouse.in) {
    ctx.save(); ctx.translate(mouse.x, mouse.y);
    if (mouse.down) { ctx.rotate(mouse.ang); if (Math.cos(mouse.ang) < 0) ctx.scale(1, -1); drawShark(ctx, t, light); }
    else { ctx.strokeStyle = `rgba(255,255,255,${0.25 + 0.2 * light})`; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0, 0, 9 + Math.sin(t * 3) * 1.5, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 20 + Math.sin(t * 3 + 1) * 3, 0, TAU); ctx.globalAlpha = .4; ctx.stroke(); }
    ctx.restore();
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; const t = now / 1000;
  light += (lit ? 1 : 0) - light > 0 ? Math.min(dt / 1.2, 1 - light) : -Math.min(dt / 1.2, light);
  if (drumOn) scroll += dt * 14 * (0.4 + 0.6 * light);
  for (const b of bubbles) { b.y -= b.v * dt / H; if (b.y < -0.02) { b.y = 1.02; b.x = Math.random(); } }
  step(dt); draw(t); requestAnimationFrame(frame);
}
resize(); spawn(); window.addEventListener('resize', resize);
if (location.search.includes('off')) setLit(false);   // debug: night mode for screenshots
if (location.search.includes('shark')) { mouse.in = true; mouse.down = true; mouse.x = W * 0.5; mouse.y = H * 0.5; mouse.sx = xToS(0) * A; mouse.ang = 0.2; }  // debug: predator mode for screenshots
loadPanorama().then(() => requestAnimationFrame(frame));
</script>
</body>
